<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagos Homs Ilupeju Scheme - Recreational Center Booking</title>
<style>
  #vb-root {
    --ink: #201d18; --paper: #FAF6EE; --paper-raised: #FFFFFF; --line: #E4DBC8;
    --moss: #4B5D3A; --moss-deep: #34412A; --gold: #C08A28; --brick: #A44A36; --leaf: #3F7D4C; --muted: #8A8272;
    --font-display: 'Fraunces', Georgia, serif; --font-body: 'Inter', -apple-system, sans-serif;
    --radius: 10px;
    background: var(--paper); color: var(--ink); font-family: var(--font-body);
    min-height: 100vh; padding: 28px 20px 60px; box-sizing: border-box;
  }
  html, body { margin: 0; padding: 0; }
  #vb-root * { box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  #vb-root .vb-wrap { max-width: 880px; margin: 0 auto; }
  #vb-root .vb-topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #vb-root .vb-topbar > div { min-width: 0; }
  #vb-root .vb-signin { font-family: var(--font-body); font-size: 13px; font-weight: 700; color: #fff; background: var(--moss); border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  #vb-root .vb-signin:hover { background: var(--moss-deep); }
  @media (max-width: 500px) { #vb-root h1 { font-size: 24px; } #vb-root .vb-signin { padding: 9px 13px; font-size: 12px; } }
  #vb-root .vb-eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--moss); font-weight: 600; margin: 0 0 4px; }
  #vb-root h1 { font-family: var(--font-display); font-weight: 600; font-size: 30px; margin: 0 0 22px; color: var(--ink); line-height: 1.1; }

  #vb-root .vb-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  #vb-root .vb-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
  @media (max-width: 720px) { #vb-root .vb-grid { grid-template-columns: 1fr; } }

  #vb-root .vb-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #vb-root .vb-cal-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
  #vb-root .vb-nav-btn { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; width: 40px; height: 40px; cursor: pointer; font-size: 16px; color: var(--ink); }
  #vb-root .vb-nav-btn:hover { border-color: var(--moss); }
  #vb-root .vb-dow { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 6px; }
  #vb-root .vb-dow span { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; }
  #vb-root .vb-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  #vb-root .vb-day { aspect-ratio: 1; min-height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid transparent; background: var(--paper); position: relative; color: var(--ink); }
  #vb-root .vb-day.empty { visibility: hidden; cursor: default; }
  #vb-root .vb-day.past { color: #C7BFA9; cursor: not-allowed; }
  #vb-root .vb-day.selected { outline: 2px solid var(--ink); outline-offset: 1px; }
  #vb-root .vb-day.approved { background: var(--leaf); color: #fff; cursor: not-allowed; }
  #vb-root .vb-day.pending { background: var(--gold); color: #fff; }
  #vb-root .vb-day.today::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--moss); }
  #vb-root .vb-legend { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
  #vb-root .vb-legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--ink); }
  #vb-root .vb-dot { width: 14px; height: 14px; border-radius: 50%; }

  #vb-root label { display: block; font-size: 12px; font-weight: 600; color: var(--moss-deep); margin: 14px 0 6px; }
  #vb-root label:first-child { margin-top: 0; }
  #vb-root .vb-caption { font-size: 11px; color: var(--muted); margin: -3px 0 6px; }
  #vb-root input[type=text], #vb-root input[type=tel], #vb-root input[type=email], #vb-root select, #vb-root textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font-family: var(--font-body); font-size: 16px; background: var(--paper); color: var(--ink);
  }
  #vb-root textarea { resize: vertical; min-height: 60px; }
  #vb-root .vb-selected-date { font-family: var(--font-display); font-size: 17px; padding: 10px 14px; background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; color: var(--moss-deep); }
  #vb-root .vb-file-btn { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; font-size: 13px; color: var(--muted); cursor: pointer; background: var(--paper); }
  #vb-root .vb-file-btn.has-file { border-color: var(--moss); color: var(--moss-deep); }
  #vb-root .vb-thumb { max-width: 100%; max-height: 140px; border-radius: 6px; margin-top: 8px; display: block; }
  #vb-root .vb-policy-note { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--moss-deep); margin-bottom: 16px; }
  #vb-root .vb-policy-note a { color: var(--moss); font-weight: 600; text-decoration: underline; }
  #vb-root .vb-agree-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; }
  #vb-root .vb-agree-row input { width: auto; margin-top: 3px; }
  #vb-root .vb-agree-row label { margin: 0; font-size: 12px; font-weight: 500; color: var(--ink); }
  #vb-root .vb-agree-row a { color: var(--moss); font-weight: 600; text-decoration: underline; }
  #vb-root .vb-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #vb-root .vb-thumb-item { position: relative; width: 72px; height: 72px; }
  #vb-root .vb-thumb-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  #vb-root .vb-thumb-remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--brick); color: #fff; border: 2px solid var(--paper-raised); font-size: 12px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  #vb-root .vb-submit { margin-top: 18px; width: 100%; background: var(--moss); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: var(--font-body); }
  #vb-root .vb-submit:hover { background: var(--moss-deep); }
  #vb-root .vb-submit:disabled { background: #C7BFA9; cursor: not-allowed; }
  #vb-root .vb-msg { font-size: 13px; margin-top: 10px; padding: 10px 12px; border-radius: 8px; }
  #vb-root .vb-msg.ok { background: #EAF0E3; color: var(--moss-deep); }
  #vb-root .vb-msg.warn { background: #FBEED4; color: #8A6113; font-weight: 700; border: 2px solid #C08A28; font-size: 14px; }
  #vb-root .vb-msg.err { background: #F5E4DE; color: var(--brick); }
  #vc-root {
    --ink: #201d18; --paper: #FAF6EE; --paper-raised: #FFFFFF; --line: #E4DBC8;
    --moss: #4B5D3A; --moss-deep: #34412A; --gold: #C08A28; --brick: #A44A36; --leaf: #3F7D4C; --muted: #8A8272;
    --font-display: 'Fraunces', Georgia, serif; --font-body: 'Inter', -apple-system, sans-serif;
    --radius: 10px;
    background: var(--paper); color: var(--ink); font-family: var(--font-body);
    min-height: 100vh; padding: 28px 20px 60px; box-sizing: border-box;
  }
  #vc-root * { box-sizing: border-box; }

  #vc-root .vc-wrap { max-width: 720px; margin: 0 auto; }
  #vc-root .vc-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  #vc-root .vc-eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--moss); font-weight: 600; margin: 0 0 4px; }
  #vc-root h1 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 0; color: var(--ink); line-height: 1.1; }
  #vc-root .vc-preview-toggle { border: 1px solid var(--line); background: var(--paper-raised); border-radius: 999px; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--moss-deep); }
  #vc-root .vc-preview-toggle.on { background: var(--moss); color: #fff; border-color: var(--moss); }
  #vc-root .vc-session-text { font-size: 12px; color: var(--muted); }
  #vc-root .vc-logout-btn { border: 1px solid var(--brick); background: var(--paper-raised); color: var(--brick); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 8px; }
  #vc-root .vc-preview-banner { background: #FBEED4; color: #8A6113; font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 8px; margin-bottom: 14px; }

  #vc-root .vc-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  #vc-root .vc-pin-box { max-width: 300px; margin: 40px auto; text-align: center; }
  #vc-root .vc-pin-box input { text-align: center; letter-spacing: 6px; font-size: 20px; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--font-body); background: var(--paper); color: var(--ink); }
  #vc-root #vc-name-input { font-size: 16px !important; letter-spacing: normal !important; }
  #vc-root label { display: block; font-size: 12px; font-weight: 600; color: var(--moss-deep); margin-bottom: 6px; }
  #vc-root .vc-submit { margin-top: 14px; width: 100%; background: var(--moss); color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: var(--font-body); }
  #vc-root .vc-submit:hover { background: var(--moss-deep); }
  #vc-root .vc-msg { font-size: 13px; margin-top: 10px; padding: 10px 12px; border-radius: 8px; }
  #vc-root .vc-msg.err { background: #F5E4DE; color: var(--brick); }

  #vc-root .vc-booking-row { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: flex-start; flex-wrap: wrap; }
  #vc-root .vc-booking-row:last-child { border-bottom: none; }
  #vc-root .vc-b-date { font-family: var(--font-display); font-size: 15px; min-width: 78px; font-weight: 600; }
  #vc-root .vc-b-main { flex: 1; min-width: 200px; }
  #vc-root .vc-b-name { font-weight: 700; font-size: 14px; }
  #vc-root .vc-b-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #vc-root .vc-status-pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; display: inline-block; margin-top: 6px; }
  #vc-root .vc-status-pill.pending { background: #FBEED4; color: #8A6113; }
  #vc-root .vc-status-pill.awaiting_welfare { background: #DCE7F5; color: #2F5A8A; }
  #vc-root .vc-status-pill.finance_declined { background: #F5E1DC; color: var(--brick); }
  #vc-root .vc-status-pill.approved { background: #E3EFDF; color: var(--leaf); }
  #vc-root .vc-status-pill.rejected { background: #F5E1DC; color: var(--brick); }
  #vc-root .vc-status-pill.cancelled { background: #EAE0D5; color: #6B5D4A; }
  #vc-root .vc-notify-btn { display: inline-block; margin-top: 8px; margin-right: 8px; padding: 9px 14px; font-size: 12px; font-weight: 700; color: #fff; background: #25D366; border-radius: 6px; text-decoration: none; }
  #vc-root .vc-role-note { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; }
  #vc-root .vc-b-actions { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
  #vc-root .vc-b-actions button { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 9px 12px; font-size: 12px; cursor: pointer; font-weight: 600; font-family: var(--font-body); min-height: 36px; }
  #vc-root .vc-b-actions button.approve { background: var(--leaf); border-color: var(--leaf); color: #fff; }
  #vc-root .vc-b-actions button.approve:hover { background: #356A40; }
  #vc-root .vc-b-actions button.danger { background: var(--brick); border-color: var(--brick); color: #fff; }
  #vc-root .vc-b-actions button.danger:hover { background: #8A3A2A; }
  #vc-root .vc-proof-thumb { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid var(--line); }
  #vc-root .vc-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
  #vc-root .vc-modal-overlay { position: fixed; inset: 0; background: rgba(32,29,24,.75); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  #vc-root .vc-modal-overlay img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
  @media (max-width: 500px) {
    #vc-root .vc-header { flex-direction: column; align-items: flex-start; }
    #vc-root .vc-preview-toggle { width: 100%; padding: 10px 16px; }
  }
</style>
</head>
<body>

<div id="vb-root">
  <div class="vb-wrap">
    <div class="vb-topbar">
      <div>
        <p class="vb-eyebrow" id="vb-eyebrow"></p>
        <h1 id="vb-title"></h1>
      </div>
      <button type="button" class="vb-signin" id="vb-signin-btn">Committee sign in</button>
    </div>
    <div id="vb-policy-banner"></div>
    <div id="vb-load-note"></div>
    <div id="vb-book-tab"></div>
  </div>
</div>

<div id="vc-root" style="display:none;">
  <div class="vc-wrap">
    <div class="vc-header">
      <div>
        <p class="vc-eyebrow" id="vc-eyebrow"></p>
        <h1>Bookings</h1>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div id="vc-session-info"></div>
        <button type="button" class="vc-preview-toggle" id="vc-back-btn">Back to booking page</button>
        <button class="vc-preview-toggle" id="vc-preview-btn">Preview with sample data</button>
      </div>
    </div>
    <div id="vc-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ---- Edit these to configure the tool for your estate ----
  const CONFIG = {
    committeeLabel: "Lagos Homs Ilupeju Scheme",
    estateName: "Recreational Center Booking",
    // WhatsApp numbers of Finance Secretary & Assistant, who verify payment first.
    financeWhatsApp: [
      { name: "Rotana (Financial Secretary)", number: "2348038325045" },
      { name: "Temitope (Assistant Financial Secretary)", number: "2348035308329" }
    ],
    // Link to your Event Center Usage Policy (PDF hosted on Vercel, Google Drive, etc.)
    policyLink: "https://drive.google.com/file/d/1FMVoAn_Xc_iBfk2FU3aGxFWcCpLGnZIp/view?usp=sharing",
    // Supabase project connection
    supabaseUrl: "https://whgkvkzqqfwapbwudhat.supabase.co",
    supabaseKey: "sb_publishable_dGMPC9QZ2zEpLK0f6WzU8Q_-Hn3ikYG"
  };
  // -------------------------------------------------------------------

  const supabase = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);

  function fromRow(r){
    return {
      date: r.date, name: r.name, phone: r.phone, email: r.email,
      eventType: r.event_type, notes: r.notes,
      paymentImages: r.payment_images || [], status: r.status,
      submittedAt: r.submitted_at, policyAgreedAt: r.policy_agreed_at,
      actionBy: r.action_by, actionAt: r.action_at
    };
  }
  function toRow(b){
    return {
      date: b.date, name: b.name, phone: b.phone, email: b.email,
      event_type: b.eventType, notes: b.notes,
      payment_images: b.paymentImages, status: b.status,
      submitted_at: b.submittedAt, policy_agreed_at: b.policyAgreedAt,
      action_by: b.actionBy || null, action_at: b.actionAt || null
    };
  }

  const root = document.getElementById('vb-root');
  const bookTab = document.getElementById('vb-book-tab');
  document.getElementById('vb-eyebrow').textContent = CONFIG.committeeLabel;
  document.getElementById('vb-title').textContent = CONFIG.estateName;
  document.getElementById('vb-policy-banner').innerHTML =
    `<div class="vb-policy-note">Before booking, please read our <a href="${CONFIG.policyLink}" target="_blank" rel="noopener">Event Center Usage Policy</a>.</div>`;

  let calMonth = new Date().getMonth();
  let calYear = new Date().getFullYear();
  let selectedDate = null;
  let bookingsCache = {};
  let paymentImages = [];
  let loadFailed = false;

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function todayStr(){ const t = new Date(); return dateKey(t.getFullYear(), t.getMonth(), t.getDate()); }

  async function loadBookings(){
    try {
      const { data, error } = await supabase.from('bookings').select('date,status');
      if (error) throw error;
      bookingsCache = {};
      (data || []).forEach(row => { bookingsCache[row.date] = fromRow(row); });
      loadFailed = false;
    } catch(e) { console.error('Failed to load bookings', e); loadFailed = true; }
    const note = document.getElementById('vb-load-note');
    if (note) note.innerHTML = loadFailed ? '<div class="vb-msg err">We could not load the calendar just now. Please refresh the page in a minute before booking.</div>' : '';
  }

  function statusOfDate(ds){ const b = bookingsCache[ds]; return b ? b.status : null; }

  function renderCalendar(){
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    let cells = '';
    for (let i=0;i<firstDay;i++) cells += `<div class="vb-day empty"></div>`;
    const today = todayStr();
    for (let d=1; d<=daysInMonth; d++){
      const ds = dateKey(calYear, calMonth, d);
      const isPast = ds < today;
      const status = statusOfDate(ds);
      let cls = 'vb-day';
      if (isPast) cls += ' past';
      if (ds === today) cls += ' today';
      if (status === 'approved') cls += ' approved';
      if (status === 'pending' || status === 'awaiting_welfare') cls += ' pending';
      if (ds === selectedDate) cls += ' selected';
      cells += `<div class="${cls}" data-date="${ds}" data-blocked="${isPast || status==='approved' || status==='pending' || status==='awaiting_welfare'}">${d}</div>`;
    }
    return `
      <div class="vb-cal-head">
        <button class="vb-nav-btn" id="vb-prev">‹</button>
        <div class="vb-cal-title">${monthNames[calMonth]} ${calYear}</div>
        <button class="vb-nav-btn" id="vb-next">›</button>
      </div>
      <div class="vb-dow">${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="vb-days">${cells}</div>
      <div class="vb-legend">
        <div class="vb-legend-item"><span class="vb-dot" style="background:var(--paper);border:1px solid var(--line)"></span>Open</div>
        <div class="vb-legend-item"><span class="vb-dot" style="background:var(--gold)"></span>Pending approval</div>
        <div class="vb-legend-item"><span class="vb-dot" style="background:var(--leaf)"></span>Booked</div>
      </div>
    `;
  }

  function renderBookForm(){
    const dateLabel = selectedDate
      ? new Date(selectedDate+'T00:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
      : 'Pick a date on the calendar';
    return `
      <div class="vb-card">
        <label>Selected date</label>
        <div class="vb-selected-date">${dateLabel}</div>

        <label>Full name</label>
        <input type="text" id="vb-name" placeholder="e.g. Bola Adekunle">

        <label>WhatsApp number</label>
        <div class="vb-caption">Please enter a number we can reach you on WhatsApp</div>
        <input type="tel" id="vb-phone" placeholder="e.g. 080XXXXXXXX">

        <label>Email (optional)</label>
        <div class="vb-caption">We'll use this to send you a confirmation once approved</div>
        <input type="email" id="vb-email" placeholder="e.g. name@email.com">

        <label>Event type</label>
        <select id="vb-event-type">
          <option value="">Select one</option>
          <option>Birthday party</option>
          <option>Wedding / engagement</option>
          <option>Naming ceremony</option>
          <option>Meeting / seminar</option>
          <option>Other</option>
        </select>

        <label>Notes (optional)</label>
        <textarea id="vb-notes" placeholder="Expected guests, time, anything the committee should know"></textarea>

        <label>Proof of payment</label>
        <div class="vb-caption">Upload all receipts for this booking (you can add more than one)</div>
        <div class="vb-file-btn" id="vb-file-btn">Click to upload payment images</div>
        <input type="file" id="vb-file-input" accept="image/*" multiple style="display:none;">
        <div id="vb-thumbs" class="vb-thumbs"></div>

        <div class="vb-agree-row">
          <input type="checkbox" id="vb-agree">
          <label for="vb-agree">I have read and agree to the <a href="${CONFIG.policyLink}" target="_blank" rel="noopener">Event Center Usage Policy</a></label>
        </div>

        <button class="vb-submit" id="vb-submit-btn">Submit booking</button>
        <div id="vb-form-msg"></div>
      </div>
    `;
  }

  function renderBookTab(){
    bookTab.innerHTML = `<div class="vb-grid"><div class="vb-card">${renderCalendar()}</div>${renderBookForm()}</div>`;
    wireCalendarEvents(bookTab);
    wireFormEvents();
  }

  function wireCalendarEvents(container){
    const prev = container.querySelector('#vb-prev');
    const next = container.querySelector('#vb-next');
    if (prev) prev.onclick = () => { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderBookTab(); };
    if (next) next.onclick = () => { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderBookTab(); };
    container.querySelectorAll('.vb-day[data-date]').forEach(el => {
      el.onclick = () => {
        if (el.dataset.blocked === 'true') return;
        selectedDate = el.dataset.date;
        renderBookTab();
      };
    });
  }

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxW = 800;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderThumbs(){
    const container = document.getElementById('vb-thumbs');
    if (!container) return;
    container.innerHTML = paymentImages.map((src, i) => `
      <div class="vb-thumb-item">
        <img src="${src}">
        <button type="button" class="vb-thumb-remove" data-idx="${i}">×</button>
      </div>
    `).join('');
    container.querySelectorAll('.vb-thumb-remove').forEach(btn => {
      btn.onclick = () => {
        paymentImages.splice(Number(btn.dataset.idx), 1);
        renderThumbs();
        updateFileBtnLabel();
      };
    });
  }

  function updateFileBtnLabel(){
    const fileBtn = document.getElementById('vb-file-btn');
    if (!fileBtn) return;
    if (paymentImages.length === 0) {
      fileBtn.textContent = 'Click to upload payment images';
      fileBtn.classList.remove('has-file');
    } else {
      fileBtn.textContent = `${paymentImages.length} image${paymentImages.length > 1 ? 's' : ''} added — click to add more`;
      fileBtn.classList.add('has-file');
    }
  }

  function wireFormEvents(){
    const fileBtn = document.getElementById('vb-file-btn');
    const fileInput = document.getElementById('vb-file-input');
    fileBtn.onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const files = Array.from(fileInput.files || []);
      if (!files.length) return;
      fileBtn.textContent = 'Processing...';
      try {
        for (const file of files) {
          const dataUrl = await compressImage(file);
          paymentImages.push(dataUrl);
        }
        renderThumbs();
        updateFileBtnLabel();
      } catch(e) { fileBtn.textContent = 'Could not read one of those files, try again'; }
      fileInput.value = '';
    };
    document.getElementById('vb-submit-btn').onclick = submitBooking;
  }

  function showMsg(text, type){
    document.getElementById('vb-form-msg').innerHTML = `<div class="vb-msg ${type}">${text}</div>`;
  }

  async function submitBooking(){
    const btn = document.getElementById('vb-submit-btn');
    const name = document.getElementById('vb-name').value.trim();
    const phone = document.getElementById('vb-phone').value.trim();
    const email = document.getElementById('vb-email').value.trim();
    const eventType = document.getElementById('vb-event-type').value;
    const notes = document.getElementById('vb-notes').value.trim();

    if (!selectedDate) return showMsg('Pick a date on the calendar first.', 'err');
    if (!name || !phone || !eventType) return showMsg('Please fill in name, WhatsApp number, and event type.', 'err');
    if (paymentImages.length === 0) return showMsg('Please upload at least one payment image.', 'err');
    if (!document.getElementById('vb-agree').checked) return showMsg('Please confirm you have read the Event Center Usage Policy.', 'err');

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      // fresh check straight from the database
      const REUSABLE = ['finance_declined', 'rejected', 'cancelled'];
      const { data: liveRows, error: liveErr } = await supabase.from('bookings').select('date,status').eq('date', selectedDate);
      if (liveErr) throw liveErr;
      const existing = (liveRows || [])[0];

      const dateTaken = async () => {
        await loadBookings();
        selectedDate = null;
        renderBookTab();
        renderThumbs(); updateFileBtnLabel();
        showMsg('Sorry, that date was just taken by someone else. Please pick another date.', 'err');
      };
      if (existing && !REUSABLE.includes(existing.status)) { await dateTaken(); return; }

      const booking = {
        date: selectedDate, name, phone, email, eventType, notes,
        paymentImages: paymentImages.slice(), status: 'pending', submittedAt: new Date().toISOString(),
        policyAgreedAt: new Date().toISOString()
      };
      let result;
      if (existing) {
        // an earlier declined/cancelled booking on this date: replace it, and clear its old review notes
        const fresh = Object.assign(toRow(booking), {
          finance_action_by: null, finance_action_at: null, decline_reason: null,
          cancelled_by: null, cancelled_at: null, cancel_reason: null
        });
        result = await supabase.from('bookings').update(fresh).eq('date', selectedDate).in('status', REUSABLE).select('date');
        if (!result.error && (!result.data || result.data.length === 0)) { await dateTaken(); return; }
      } else {
        result = await supabase.from('bookings').insert(toRow(booking));
        if (result.error && result.error.code === '23505') { await dateTaken(); return; }
      }
      if (result.error) throw result.error;
      bookingsCache[selectedDate] = booking;

      const dateLabel = new Date(selectedDate+'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
      const financeWaText = encodeURIComponent(
        `New venue booking awaiting payment verification:\nName: ${name}\nDate: ${dateLabel}\nEvent: ${eventType}\nPhone: ${phone}\n\nPlease check the committee dashboard to verify payment and approve or decline.`
      );
      const waButtons = CONFIG.financeWhatsApp.map(c => `<a href="https://wa.me/${c.number}?text=${financeWaText}" target="_blank" rel="noopener" class="vb-submit" style="display:block;text-align:center;text-decoration:none;margin-top:8px;background:#25D366;">Notify ${c.name} (Finance) on WhatsApp</a>`).join('');

      document.getElementById('vb-form-msg').innerHTML = `
        <div class="vb-msg ok">Booking submitted successfully.</div>
        <div class="vb-msg warn">⚠️ IMPORTANT: Your booking will NOT be reviewed until you click the button(s) below to notify Finance. Please do this now.</div>
        ${waButtons}
      `;
      btn.style.display = 'none';
      paymentImages = [];
    } catch(e) {
      console.error(e);
      showMsg('Something went wrong submitting your booking: ' + (e.message || 'please try again.'), 'err');
      btn.disabled = false;
      btn.textContent = 'Submit booking';
    }
  }

  loadBookings().then(renderBookTab);
})();
</script>

          ${isPreview ? thumbsHtml + (images.length ? `<span style="font-size:9px;color:var(--muted);text-align:center;">Tap to view</span>` : '') : `<span style="font-size:10px;color:var(--muted);text-align:center;">Loading receipts...</span>`}
        </div>
        <div class="vc-b-date">${new Date(b.date+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</div>
        <div class="vc-b-main">
          <div class="vc-b-name">${escapeHtml(b.name)}</div>
          <div class="vc-b-sub">${escapeHtml(b.phone)}${b.email ? ' · ' + escapeHtml(b.email) : ''} · ${escapeHtml(b.eventType)}</div>
          ${b.notes ? `<div class="vc-b-sub">${escapeHtml(b.notes)}</div>` : ''}
          ${b.policyAgreedAt ? `<div class="vc-b-sub">Agreed to usage policy at submission</div>` : ''}
          <span class="vc-status-pill ${b.status}">${statusLabels[b.status] || b.status}</span>
          ${b.declineReason ? `<div class="vc-b-sub" style="margin-top:4px;">Reason: ${escapeHtml(b.declineReason)}</div>` : ''}
          ${b.financeActionBy ? `<div class="vc-b-sub" style="margin-top:4px;">Payment ${b.status === 'finance_declined' ? 'declined' : 'confirmed'} by ${escapeHtml(b.financeActionBy)} · ${new Date(b.financeActionAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
          ${b.actionBy ? `<div class="vc-b-sub">${b.status === 'approved' ? 'Approved' : 'Rejected'} by ${escapeHtml(b.actionBy)} · ${new Date(b.actionAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>` : ''}
          ${b.cancelledBy ? `<div class="vc-b-sub">Cancelled by ${escapeHtml(b.cancelledBy)} · ${new Date(b.cancelledAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${b.cancelReason ? ' · Reason: ' + escapeHtml(b.cancelReason) : ''}</div>` : ''}
          ${notifyHtml}

        <div class="vc-b-actions">
          ${actionsHtml}

    }).join('');

    bindThumbs(listEl);
    if (!isPreview) loadReceipts(listEl);

    if (!isPreview){
      listEl.querySelectorAll('.vc-b-actions button').forEach(btn => {
        btn.onclick = async () => {
          const date = btn.dataset.date;
          const action = btn.dataset.action;
          const stage = btn.dataset.stage; // 'finance', 'welfare', 'cancel', or undefined for delete
          const expectedStatus = bookingsCache[date] ? bookingsCache[date].status : null;

          let reason = null;
          if (action === 'finance_declined' || action === 'rejected') {
            reason = prompt('Please give a short reason (this will be shared with the resident):');
            if (reason === null) return; // cancelled
          }
          if (action === 'cancelled') {
            reason = prompt('Reason for cancelling (optional, will be shared with the resident):') || '';
          }

          btn.disabled = true;
          try {
            if (action === 'delete') {
              const { error: delErr } = await supabase.from('bookings').delete().eq('date', date);
              if (delErr) throw delErr;
              delete bookingsCache[date];
              renderBody();
              return;
            }
            // Re-check the live record before writing, in case someone else just acted on it
            const { data: liveRow, error: liveErr } = await supabase.from('bookings').select('*').eq('date', date).single();
            if (liveErr) throw liveErr;
            const live = liveRow ? fromRow(liveRow) : null;
            if (!live) { renderBody(); return; }
            if (live.status !== expectedStatus) {
              alert(`This booking was already updated by ${live.actionBy || live.financeActionBy || live.cancelledBy || 'someone else'} in the meantime (now "${live.status}"). Refreshing the list.`);
              renderBody();
              return;
            }

            const update = { status: action };
            if (stage === 'finance') {
              update.decline_reason = reason;
              update.finance_action_by = memberName;
              update.finance_action_at = new Date().toISOString();
            } else if (stage === 'welfare') {
              update.decline_reason = reason;
              update.action_by = memberName;
              update.action_at = new Date().toISOString();
            } else if (stage === 'cancel') {
              update.cancel_reason = reason;
              update.cancelled_by = memberName;
              update.cancelled_at = new Date().toISOString();
            }

            const { error: updErr } = await supabase.from('bookings').update(update).eq('date', date);
            if (updErr) throw updErr;
            renderBody();
          } catch(e) { console.error(e); btn.disabled = false; }
        };
      });
    }
  }

  function renderSessionInfo(){
    const el = document.getElementById('vc-session-info');
    if (!unlocked) { el.innerHTML = ''; return; }
    el.innerHTML = `<span class="vc-session-text">Logged in as <strong>${escapeHtml(memberName)}</strong></span><button class="vc-logout-btn" id="vc-logout-btn">Logout</button>`;
    document.getElementById('vc-logout-btn').onclick = () => {
      unlocked = false;
      memberName = '';
      memberRole = '';
      previewMode = false;
      renderBody();
    };
  }

  function renderBody(){
    renderSessionInfo();
    if (!unlocked) { renderPinGate(); return; }
    if (previewMode) {
      renderList(SAMPLE, true);
      return;
    }
    body.innerHTML = `<div class="vc-card">Loading bookings...</div>`;
    loadBookings().then((err) => {
      if (err) {
        body.innerHTML = `<div class="vc-card"><div class="vc-msg err">Could not load bookings: ${escapeHtml(err)}</div><button class="vc-submit" id="vc-retry">Try again</button></div>`;
        document.getElementById('vc-retry').onclick = () => renderBody();
        return;
      }
      const all = Object.values(bookingsCache).sort((a,b) => a.date.localeCompare(b.date));
      renderList(all, false);
    });
  }

  document.getElementById('vc-preview-btn').onclick = () => {
    previewMode = !previewMode;
    document.getElementById('vc-preview-btn').classList.toggle('on', previewMode);
    document.getElementById('vc-preview-btn').textContent = previewMode ? 'Exit preview' : 'Preview with sample data';
    if (unlocked) renderBody();
  };

  renderBody();
})();
</script>
<script>
(function(){
  var vb = document.getElementById('vb-root'), vc = document.getElementById('vc-root');
  function show(which){
    vb.style.display = which === 'committee' ? 'none' : '';
    vc.style.display = which === 'committee' ? '' : 'none';
    window.scrollTo(0, 0);
  }
  document.getElementById('vb-signin-btn').onclick = function(){
    show('committee');
    var p = document.getElementById('vc-pin-input');
    if (p) p.focus();
  };
  document.getElementById('vc-back-btn').onclick = function(){ show('book'); };
})();
</script>
</body>
